{"name": "Update NBA data", "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Fetch NBA game logs", "run": "python fetch_nba.py --repo"}, {"name": "Save data", "run": "git config user.name \"github-actions\"\ngit config user.email \"github-actions@users.noreply.github.com\"\ngit pull --rebase || true\ngit add data\ngit diff --cached --quiet || git commit -m \"Update NBA data\"\ngit push\n"}]}}, "on": {"schedule": [{"cron": "0 14 * * *"}], "workflow_dispatch": null, "push": {"paths": ["fetch_nba.py", ".github/workflows/update.yml"]}}}
